name: Publish reviewed seekdb AI answer
on:
  push:
    branches: [codex/bootstrap-seekdb-2026]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch the immutable public contest baseline
        run: |
          git init answer
          cd answer
          git remote add contest-base https://github.com/oceanbase/seekdb.git
          git config remote.contest-base.promisor true
          git config remote.contest-base.partialclonefilter blob:none
          git -c protocol.version=2 fetch --filter=blob:none --no-tags contest-base 5bce9e06d1281347ad61344e4b01fab9158c58a2
          git checkout -b codex/seekdb-2026 FETCH_HEAD
