name: Publish reviewed AMD V5 answer
on:
  push:
    branches: [codex/bootstrap-amd-v5]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch the immutable public contest baseline
        run: |
          git init answer
          cd answer
          git remote add contest-base https://github.com/zihaomu/seekdb.git
          git config remote.contest-base.promisor true
          git config remote.contest-base.partialclonefilter blob:none
          git -c protocol.version=2 fetch --filter=blob:none --no-tags contest-base 634888d9b037153fa143d2c913ba4b25503e1d62
          git checkout -b codex/amd-cagra-v5 FETCH_HEAD
      - name: Apply the reviewed source patch
        working-directory: answer
        run: |
          cat > ../reviewed.patch <<'AMD_V5_REVIEWED_PATCH'
          diff --git a/benchmarks/cagra_bridge.py b/benchmarks/cagra_bridge.py
          new file mode 100644
          index 0000000..1c30c7f
          --- /dev/null
          +++ b/benchmarks/cagra_bridge.py
          @@ -0,0 +1,149 @@
          +"""Measure real bridge construction, scalar queries, recall, and snapshot recovery.
          +
          +This isolates the bridge; SQL DDL timing still requires a complete seekdb build.
          +"""
          +
          +import argparse
          +import ctypes as c
          +import hashlib
          +import json
          +from pathlib import Path
          +import resource
          +import time
          +import threading
          +
          +import numpy as np
          +
          +
          +def main():
          +    parser = argparse.ArgumentParser(description=__doc__)
          +    parser.add_argument("library", type=Path)
          +    parser.add_argument("--data", type=Path, default=Path("/seekdb_workspace/datasets"))
          +    parser.add_argument("--dimension", type=int, default=128)
          +    parser.add_argument("--rows", type=int)
          +    parser.add_argument("--transient-threads", action="store_true", help="Match the adaptor's new thread per query")
          +    args = parser.parse_args()
          +    threading.stack_size(32 * 1024 * 1024)
          +    soft, hard = resource.getrlimit(resource.RLIMIT_STACK)
          +    resource.setrlimit(resource.RLIMIT_STACK, (hard, hard))
          +    base = np.fromfile(args.data / "base.f32", dtype=np.float32).reshape(-1, args.dimension)
          +    if args.rows:
          +        base = np.ascontiguousarray(base[:args.rows])
          +    queries = np.fromfile(args.data / "query.f32", dtype=np.float32).reshape(-1, args.dimension)
          +    k_max = min(100, len(base))
          +    exact = []
          +    base64 = base.astype(np.float64)
          +    squared = np.sum(base64 * base64, axis=1)
          +    query64 = queries.astype(np.float64)
          +    all_distances = squared[None, :] + np.sum(query64 * query64, axis=1)[:, None] - 2 * (query64 @ base64.T)
          +    for distances in all_distances:
          +        ids = np.argpartition(distances, k_max - 1)[:k_max]
          +        ids = ids[np.lexsort((ids, distances[ids]))]
          +        exact.append(ids)
          +    del base64
          +    del all_distances
          +    library = c.CDLL(str(args.library.resolve()))
          +    float_p, uint_p = c.POINTER(c.c_float), c.POINTER(c.c_uint)
          +    library.seekdb_cuvs_build.argtypes = [float_p, c.c_long, c.c_long]
          +    library.seekdb_cuvs_build.restype = c.c_void_p
          +    library.seekdb_cuvs_search.argtypes = [c.c_void_p, float_p, c.c_long, c.c_long, uint_p, float_p]
          +    library.seekdb_cuvs_search.restype = c.c_int
          +    library.seekdb_cuvs_free.argtypes = [c.c_void_p]
          +    library.seekdb_cuvs_serialize.argtypes = [c.c_void_p, c.c_char_p]
          +    library.seekdb_cuvs_deserialize.argtypes = [c.c_char_p, c.c_long, c.c_long]
          +    library.seekdb_cuvs_deserialize.restype = c.c_void_p
          +
          +    def execute_search(handle, query, k, check_distance=False):
          +        ids = np.empty(k, dtype=np.uint32)
          +        distances = np.empty(k, dtype=np.float32)
          +        rc = library.seekdb_cuvs_search(
          +            handle, query.ctypes.data_as(float_p), 1, k,
          +            ids.ctypes.data_as(uint_p), distances.ctypes.data_as(float_p),
          +        )
          +        if rc:
          +            raise RuntimeError(f"GPU search failed: {rc}")
          +        if len(set(map(int, ids))) != k or np.any(ids >= len(base)) or not np.isfinite(distances).all():
          +            raise RuntimeError("invalid GPU result identities or distances")
          +        if check_distance:
          +            expected = np.sum((base[ids].astype(np.float64) - query.astype(np.float64)) ** 2, axis=1)
          +            if not np.allclose(distances, expected, rtol=1e-4, atol=2e-5):
          +                raise RuntimeError("GPU distances differ from original FP32 squared L2")
          +        return ids
          +
          +    def search(handle, query, k):
          +        if not args.transient_threads:
          +            return execute_search(handle, query, k)
          +        result, errors = [], []
          +
          +        def invoke():
          +            try:
          +                result.append(execute_search(handle, query, k))
          +            except Exception as error:
          +                errors.append(error)
          +
          +        worker = threading.Thread(target=invoke)
          +        worker.start()
          +        worker.join()
          +        if errors:
          +            raise errors[0]
          +        return result[0]
          +
          +    start = time.perf_counter()
          +    handle = library.seekdb_cuvs_build(base.ctypes.data_as(float_p), len(base), args.dimension)
          +    if not handle:
          +        raise RuntimeError("GPU construction failed")
          +    report = {
          +        "library": str(args.library), "rows": len(base), "dimension": args.dimension,
          +        "transient_threads": args.transient_threads,
          +    }
          +    snapshot = args.library.with_suffix(".snapshot")
          +    recovered_snapshot = args.library.with_suffix(".recovered.snapshot")
          +    try:
          +        search(handle, queries[0], min(10, len(base)))
          +        report["build_and_first_query_seconds"] = time.perf_counter() - start
          +        for k in sorted({min(10, len(base)), k_max}):
          +            latency, recall = [], []
          +            for i, query in enumerate(queries):
          +                begin = time.perf_counter()
          +                ids = search(handle, query, k)
          +                latency.append((time.perf_counter() - begin) * 1000)
          +                recall.append(len(set(map(int, ids)) & set(map(int, exact[i][:k]))) / k)
          +            report[f"p50_query_ms_at_{k}"] = float(np.median(latency))
          +            report[f"recall_at_{k}"] = float(np.mean(recall))
          +        before = search(handle, queries[0], k_max)
          +        repeated = search(handle, queries[0], k_max)
          +        report["repeat_id_overlap"] = len(set(map(int, before)) & set(map(int, repeated))) / k_max
          +        for query in queries[:5]:
          +            execute_search(handle, query, k_max, check_distance=True)
          +        report["original_l2_distances_verified"] = True
          +        if library.seekdb_cuvs_serialize(handle, str(snapshot).encode()):
          +            raise RuntimeError("snapshot write failed")
          +    finally:
          +        library.seekdb_cuvs_free(handle)
          +    handle = library.seekdb_cuvs_deserialize(str(snapshot).encode(), len(base), args.dimension)
          +    if not handle:
          +        raise RuntimeError("snapshot load failed")
          +    try:
          +        after = search(handle, queries[0], k_max)
          +        report["snapshot_same_ids"] = bool(np.array_equal(before, after))
          +        report["snapshot_id_overlap"] = len(set(map(int, before)) & set(map(int, after))) / k_max
          +        if library.seekdb_cuvs_serialize(handle, str(recovered_snapshot).encode()):
          +            raise RuntimeError("recovered snapshot write failed")
          +        def digest(path):
          +            with path.open("rb") as stream:
          +                return hashlib.file_digest(stream, "sha256").hexdigest()
          +        report["snapshot_bytes_identical"] = digest(snapshot) == digest(recovered_snapshot)
          +        for query in queries[:5]:
          +            execute_search(handle, query, k_max, check_distance=True)
          +    finally:
          +        library.seekdb_cuvs_free(handle)
          +        recovered_snapshot.unlink(missing_ok=True)
          +    print(json.dumps(report, sort_keys=True), flush=True)
          +    # CAGRA traversal can vary between calls. Verify the graph and dataset are
          +    # preserved byte-for-byte rather than requiring a deterministic traversal.
          +    if not report["snapshot_bytes_identical"]:
          +        raise RuntimeError("snapshot changed graph or dataset bytes")
          +
          +
          +if __name__ == "__main__":
          +    main()
          diff --git a/benchmarks/make_synthetic.py b/benchmarks/make_synthetic.py
          new file mode 100644
          index 0000000..536edcd
          --- /dev/null
          +++ b/benchmarks/make_synthetic.py
          @@ -0,0 +1,28 @@
          +"""Generate independent FP32 unit-vector data for local CAGRA stress testing."""
          +
          +import argparse
          +import json
          +from pathlib import Path
          +
          +import numpy as np
          +
          +parser = argparse.ArgumentParser(description=__doc__)
          +parser.add_argument("output", type=Path)
          +parser.add_argument("--rows", type=int, default=250000)
          +parser.add_argument("--dimension", type=int, default=256)
          +parser.add_argument("--queries", type=int, default=100)
          +parser.add_argument("--seed", type=int, default=20261031)
          +args = parser.parse_args()
          +args.output.mkdir(parents=True, exist_ok=True)
          +rng = np.random.default_rng(args.seed)
          +for name, rows in (("base", args.rows), ("query", args.queries)):
          +    values = rng.standard_normal((rows, args.dimension), dtype=np.float32)
          +    values /= np.linalg.norm(values, axis=1, keepdims=True)
          +    values.tofile(args.output / f"{name}.f32")
          +manifest = {
          +    "distribution": "independent standard Gaussian, normalized to unit L2 length",
          +    "rows": args.rows, "dimension": args.dimension, "queries": args.queries, "seed": args.seed,
          +    "purpose": "development stress data; not competition data or an official score",
          +}
          +(args.output / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          +print(json.dumps(manifest))
          diff --git a/benchmarks/sql_cagra.py b/benchmarks/sql_cagra.py
          new file mode 100644
          index 0000000..7c9ea04
          --- /dev/null
          +++ b/benchmarks/sql_cagra.py
          @@ -0,0 +1,90 @@
          +"""Measure CAGRA through seekdb's real CREATE INDEX and scalar SQL paths.
          +
          +The caller selects the bridge with LD_LIBRARY_PATH when starting the server.
          +Data loading and exact CPU ground truth are outside the measured interval.
          +Only the dedicated amd_sql_validation database is modified.
          +"""
          +
          +import argparse
          +import json
          +from pathlib import Path
          +import time
          +
          +import numpy as np
          +import pymysql
          +
          +
          +parser = argparse.ArgumentParser(description=__doc__)
          +parser.add_argument("mode", choices=("prepare", "measure"))
          +parser.add_argument("--root", type=Path, default=Path("/workspace/codex-v5-bridge"))
          +parser.add_argument("--label", default="baseline")
          +parser.add_argument("--port", type=int, default=2883)
          +args = parser.parse_args()
          +connection = pymysql.connect(host="127.0.0.1", port=args.port, user="root", autocommit=True,
          +                             read_timeout=1200, write_timeout=1200)
          +reports = []
          +with connection.cursor() as cursor:
          +    cursor.execute("CREATE DATABASE IF NOT EXISTS amd_sql_validation")
          +    cursor.execute("USE amd_sql_validation")
          +    for dataset, dimension, table in (("sift250k", 128, "sift"),
          +                                       ("synthetic250k-d256", 256, "unit_vectors")):
          +        base = np.fromfile(args.root / dataset / "base.f32", dtype=np.float32).reshape(-1, dimension)
          +        queries = np.fromfile(args.root / dataset / "query.f32", dtype=np.float32).reshape(-1, dimension)
          +        if args.mode == "prepare":
          +            cursor.execute(f"CREATE TABLE IF NOT EXISTS {table}(id BIGINT PRIMARY KEY,v VECTOR({dimension}))")
          +            cursor.execute(f"SELECT COUNT(*) FROM {table}")
          +            existing = cursor.fetchone()[0]
          +            if existing not in (0, len(base)):
          +                raise RuntimeError(f"incomplete owned table {table}: {existing}")
          +            if not existing:
          +                start = time.perf_counter()
          +                for first in range(0, len(base), 1000):
          +                    rows = [(first + i, json.dumps(v.tolist(), separators=(",", ":")))
          +                            for i, v in enumerate(base[first:first + 1000])]
          +                    cursor.executemany(f"INSERT INTO {table}(id,v) VALUES(%s,%s)", rows)
          +                    if first % 25000 == 0:
          +                        print("import", dataset, first + len(rows), time.perf_counter() - start, flush=True)
          +            cursor.execute(f"SELECT COUNT(*) FROM {table}")
          +            assert cursor.fetchone()[0] == len(base)
          +            print("prepared", dataset, len(base), flush=True)
          +            continue
          +        # Independent FP64 exact neighbours. No judge answers or hidden labels.
          +        base64 = base.astype(np.float64)
          +        query64 = queries.astype(np.float64)
          +        distances = (np.sum(base64 * base64, axis=1)[None, :]
          +                     + np.sum(query64 * query64, axis=1)[:, None] - 2 * (query64 @ base64.T))
          +        exact = []
          +        for distance in distances:
          +            ids = np.argpartition(distance, 99)[:100]
          +            exact.append(ids[np.lexsort((ids, distance[ids]))])
          +        del base64, distances
          +        literals = [json.dumps(q.tolist(), separators=(",", ":")) for q in queries]
          +
          +        def query(index, k):
          +            cursor.execute(f"SELECT id FROM {table} ORDER BY l2_distance(v,'{literals[index]}') APPROXIMATE LIMIT {k}")
          +            return [row[0] for row in cursor.fetchall()]
          +
          +        start = time.perf_counter()
          +        cursor.execute(f"CREATE VECTOR INDEX idx_cagra ON {table}(v) "
          +                       "WITH(distance=l2,type=hnsw,lib=cuvs,m=16,ef_construction=200,ef_search=64)")
          +        query(0, 10)
          +        report = {"label": args.label, "dataset": dataset, "rows": len(base), "dimension": dimension,
          +                  "query_count": len(queries), "ddl_and_first_query_seconds": time.perf_counter() - start}
          +        for k in (10, 100):
          +            latency, recall = [], []
          +            for i in range(len(queries)):
          +                start = time.perf_counter()
          +                ids = query(i, k)
          +                latency.append((time.perf_counter() - start) * 1000)
          +                assert len(ids) == k and len(set(ids)) == k
          +                recall.append(len(set(ids) & set(map(int, exact[i][:k]))) / k)
          +            report[f"recall_at_{k}"] = float(np.mean(recall))
          +            report[f"p50_sql_query_ms_at_{k}"] = float(np.median(latency))
          +        reports.append(report)
          +        print(json.dumps(report, sort_keys=True), flush=True)
          +        # Remove the completed index before switching bridge libraries. Keep
          +        # imported rows, so the next measurement uses the identical SQL data.
          +        cursor.execute(f"DROP INDEX idx_cagra ON {table}")
          +connection.close()
          +if reports:
          +    (args.root / f"sql-{args.label}.json").write_text(json.dumps(reports, indent=2) + "\n")
          diff --git a/benchmarks/test_gpu_worker.c b/benchmarks/test_gpu_worker.c
          new file mode 100644
          index 0000000..fab022f
          --- /dev/null
          +++ b/benchmarks/test_gpu_worker.c
          @@ -0,0 +1,46 @@
          +/* Copyright (c) 2026 OceanBase.
          + * Licensed under the Apache License, Version 2.0. */
          +#include "gpu_worker.h"
          +#include <assert.h>
          +#include <pthread.h>
          +#include <stdint.h>
          +
          +typedef struct {
          +  int input, output;
          +  pthread_t executed_by;
          +} result;
          +
          +static void calculate(void *argument)
          +{
          +  result *value = (result*)argument;
          +  value->output = value->input * 7;
          +  value->executed_by = pthread_self();
          +}
          +
          +static void nested(void *argument)
          +{
          +  assert(gpu_worker_run(calculate, argument) == 0);
          +}
          +
          +static void *caller(void *argument)
          +{
          +  intptr_t number = (intptr_t)argument;
          +  pthread_t previous;
          +  for (int i = 0; i < 200; ++i) {
          +    result value = {(int)(number * 200 + i), -1, pthread_self()};
          +    assert(gpu_worker_run(i % 2 == 0 ? calculate : nested, &value) == 0);
          +    assert(value.output == value.input * 7);
          +    assert(!pthread_equal(value.executed_by, pthread_self()));
          +    if (i != 0) assert(pthread_equal(previous, value.executed_by));
          +    previous = value.executed_by;
          +  }
          +  return NULL;
          +}
          +
          +int main(void)
          +{
          +  pthread_t callers[8];
          +  for (intptr_t i = 0; i < 8; ++i) assert(pthread_create(&callers[i], NULL, caller, (void*)i) == 0);
          +  for (int i = 0; i < 8; ++i) assert(pthread_join(callers[i], NULL) == 0);
          +  return 0;
          +}
          diff --git a/benchmarks/tune_bridge.py b/benchmarks/tune_bridge.py
          new file mode 100644
          index 0000000..d6f05f6
          --- /dev/null
          +++ b/benchmarks/tune_bridge.py
          @@ -0,0 +1,62 @@
          +"""Build isolated parameter variants and compare the real GPU bridge.
          +
          +Run in the assigned AMD development container. Each measurement gets its own
          +process and output files; variants run consecutively to avoid GPU contention.
          +"""
          +
          +import argparse
          +import json
          +import os
          +from pathlib import Path
          +import shutil
          +import subprocess
          +import sys
          +
          +
          +def main():
          +    parser = argparse.ArgumentParser(description=__doc__)
          +    parser.add_argument("root", type=Path)
          +    parser.add_argument("--data", type=Path, required=True)
          +    parser.add_argument("--dimension", type=int, required=True)
          +    args = parser.parse_args()
          +    source = args.root / "candidate"
          +    original = (source / "seekdb_cuvs_bridge.c").read_text()
          +    variants = [
          +        ("nn100-auto512", "NN_DESCENT", 128, 256, 100, 512),
          +        ("nn32-g64-auto2048", "NN_DESCENT", 64, 128, 32, 2048),
          +        ("nn32-g64-auto4096", "NN_DESCENT", 64, 128, 32, 4096),
          +        ("ivfpq-g128-auto2048", "IVF_PQ", 128, 256, 100, 2048),
          +        ("ivfpq-g64-auto2048", "IVF_PQ", 64, 128, 100, 2048),
          +        ("ivfpq-g64-auto4096", "IVF_PQ", 64, 128, 100, 4096),
          +    ]
          +    for name, algorithm, degree, intermediate, iterations, candidates in variants:
          +        target = args.root / name
          +        target.mkdir(exist_ok=True)
          +        for filename in ["build.sh", "seekdb_cuvs_bridge.h", "gpu_worker.c", "gpu_worker.h"]:
          +            shutil.copy2(source / filename, target / filename)
          +        text = original.replace("build_algo = NN_DESCENT", f"build_algo = {algorithm}")
          +        text = text.replace("graph_degree = 128;", f"graph_degree = {degree};")
          +        text = text.replace("intermediate_graph_degree = 256;", f"intermediate_graph_degree = {intermediate};")
          +        text = text.replace("nn_descent_niter = 24;", f"nn_descent_niter = {iterations};")
          +        text = text.replace("sp->algo = SINGLE_CTA;", "sp->algo = AUTO;")
          +        text = text.replace("if (required_itopk < 512) required_itopk = 512;",
          +                            f"if (required_itopk < {candidates}) required_itopk = {candidates};")
          +        (target / "seekdb_cuvs_bridge.c").write_text(text)
          +        library = target / "libseekdb_cuvs_bridge.so"
          +        build = subprocess.run(["bash", str(target / "build.sh"), str(library)], capture_output=True, text=True)
          +        (target / "compile.log").write_text(build.stdout + build.stderr)
          +        print(json.dumps({"variant": name, "compile_exit": build.returncode}), flush=True)
          +        if build.returncode:
          +            continue
          +        result = subprocess.run([
          +            sys.executable, str(args.root / "cagra_bridge.py"), str(library),
          +            "--data", str(args.data), "--dimension", str(args.dimension), "--transient-threads",
          +        ], capture_output=True, text=True, env=os.environ.copy())
          +        (target / "benchmark.json").write_text(result.stdout)
          +        (target / "benchmark.stderr").write_text(result.stderr)
          +        print(json.dumps({"variant": name, "exit": result.returncode,
          +                          "output": result.stdout, "error": result.stderr[-2000:]}), flush=True)
          +
          +
          +if __name__ == "__main__":
          +    main()
          diff --git a/benchmarks/tune_precision.py b/benchmarks/tune_precision.py
          new file mode 100644
          index 0000000..09a072a
          --- /dev/null
          +++ b/benchmarks/tune_precision.py
          @@ -0,0 +1,75 @@
          +"""Compare graph builders and FP32 IVF-PQ distances on both development corpora."""
          +
          +import json
          +import os
          +from pathlib import Path
          +import shutil
          +import subprocess
          +import sys
          +
          +
          +root = Path(sys.argv[1])
          +reference = root / "ivfpq-g64-auto4096"
          +original = (reference / "seekdb_cuvs_bridge.c").read_text()
          +variants = [("ivfpq-f32-r2", 2, 4096), ("ivfpq-f32-r4", 4, 4096),
          +            ("nn32-g32-4096", 0, 4096), ("nn32-g32-8192", 0, 8192)]
          +if len(sys.argv) > 2:
          +    variants = [variant for variant in variants if variant[0].startswith(sys.argv[2])]
          +
          +for name, refinement, candidates in variants:
          +    target = root / name
          +    target.mkdir(exist_ok=True)
          +    for filename in ["build.sh", "seekdb_cuvs_bridge.h", "gpu_worker.c", "gpu_worker.h"]:
          +        shutil.copy2(reference / filename, target / filename)
          +    text = original
          +    if refinement:
          +        text = text.replace("#include <cuvs/neighbors/cagra.h>",
          +                            "#include <cuvs/neighbors/cagra.h>\n#include <cuvs/neighbors/ivf_pq.h>")
          +        before = "  if (cuvsCagraBuild(h->res, h->ip, &dset, h->idx) != CUVS_SUCCESS) goto fail_idx;"
          +        after = """  cuvsIvfPqIndexParams_t pq_build = NULL;
          +  cuvsIvfPqSearchParams_t pq_search = NULL;
          +  struct cuvsIvfPqParams graph_params = {0};
          +  if (cuvsIvfPqIndexParamsCreate(&pq_build) != CUVS_SUCCESS) goto fail_idx;
          +  if (cuvsIvfPqSearchParamsCreate(&pq_search) != CUVS_SUCCESS) {
          +    cuvsIvfPqIndexParamsDestroy(pq_build); goto fail_idx;
          +  }
          +  pq_build->n_lists = (uint32_t)((n + 1023) / 1024);
          +  pq_search->n_probes = pq_build->n_lists < 32 ? pq_build->n_lists : 32;
          +  pq_search->lut_dtype = HIP_R_32F;
          +  pq_search->internal_distance_dtype = HIP_R_32F;
          +  pq_search->coarse_search_dtype = HIP_R_32F;
          +  graph_params.ivf_pq_build_params = pq_build;
          +  graph_params.ivf_pq_search_params = pq_search;
